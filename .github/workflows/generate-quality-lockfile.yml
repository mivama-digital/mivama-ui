name: Bootstrap quality foundation

on:
  push:
    branches:
      - agent/test-quality-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install quality tools
        run: >-
          npm install --save-dev
          @eslint/js
          eslint-plugin-import-x
          eslint-plugin-unused-imports
          globals
          prettier
          vitest
          jsdom
          @testing-library/react
          @testing-library/dom
          @testing-library/user-event
          @testing-library/jest-dom
          @vitest/coverage-v8
          axe-core
          vitest-axe
      - name: Generate quality foundation
        run: node scripts/bootstrap-quality.mjs
      - name: Format and verify
        run: |
          npx prettier --write package.json package-lock.json eslint.config.mjs vitest.config.ts tests/setup.ts tests/runtime/provider.test.tsx tests/runtime/button-accessibility.test.tsx .prettierrc.json
          npm run verify
      - name: Commit generated foundation
        run: |
          rm .github/workflows/generate-quality-lockfile.yml scripts/bootstrap-quality.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: add quality foundation"
          git push
