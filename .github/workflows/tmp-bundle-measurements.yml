name: Temporary bundle measurements

on:
  push:
    branches: [perf/compressed-bundles]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/vite-react-19/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Measure raw, gzip, and Brotli sizes
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises"
          import { brotliCompressSync, constants, gzipSync } from "node:zlib"

          const files = [
            "dist/index.js",
            "dist/components/ui/button.js",
            "dist/components/ui/dialog.js",
            "dist/components/ui/sheet.js",
            "dist/components/ui/tooltip.js",
            "dist/components/ui/sidebar.js",
            "dist/styles.css",
            "dist/tokens.css",
            "dist/themes.css",
          ]

          for (const file of files) {
            const content = await readFile(file)
            const gzip = gzipSync(content, { level: 9 }).length
            const brotli = brotliCompressSync(content, {
              params: { [constants.BROTLI_PARAM_QUALITY]: 11 },
            }).length
            console.log(`${file} raw=${content.length} gzip=${gzip} brotli=${brotli}`)
          }
          NODE
      - name: Measure packed tree shaking
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process"
          import { mkdirSync, readFileSync, rmSync, statSync, writeFileSync } from "node:fs"
          import path from "node:path"

          const root = process.cwd()
          const fixture = path.join(root, "fixtures", "vite-react-19")
          const artifacts = path.join(root, ".artifacts", "tree-shaking")
          const workspace = path.join(fixture, ".tree-shaking")

          rmSync(artifacts, { recursive: true, force: true })
          rmSync(workspace, { recursive: true, force: true })
          mkdirSync(artifacts, { recursive: true })
          mkdirSync(workspace, { recursive: true })

          const run = (command, args, cwd, env = {}) =>
            execFileSync(command, args, {
              cwd,
              env: { ...process.env, ...env },
              stdio: "inherit",
            })

          const packOutput = execFileSync(
            "npm",
            ["pack", "--json", "--pack-destination", artifacts],
            { cwd: root, encoding: "utf8" }
          )
          const [packed] = JSON.parse(packOutput)
          const tarball = path.join(artifacts, packed.filename)

          run("npm", ["ci", "--ignore-scripts"], fixture)
          run(
            "npm",
            [
              "install",
              "--ignore-scripts",
              "--no-save",
              "--package-lock=false",
              tarball,
            ],
            fixture
          )

          writeFileSync(
            path.join(workspace, "direct.js"),
            'import { Button } from "@mivama/ui/button"; console.log(Button)\n'
          )
          writeFileSync(
            path.join(workspace, "root.js"),
            'import { Button } from "@mivama/ui"; console.log(Button)\n'
          )
          writeFileSync(
            path.join(workspace, "vite.config.mjs"),
            `import { defineConfig } from "vite"\nimport path from "node:path"\n\nexport default defineConfig({\n  build: {\n    lib: { entry: path.resolve(process.env.TREE_ENTRY), formats: ["es"], fileName: "bundle" },\n    outDir: path.resolve(process.env.TREE_OUT),\n    emptyOutDir: true,\n    minify: "oxc",\n    rollupOptions: { external: ["react", "react-dom", "react/jsx-runtime"] },\n  },\n})\n`
          )

          for (const name of ["direct", "root"]) {
            const out = path.join(workspace, `dist-${name}`)
            run(
              "npm",
              [
                "exec",
                "--",
                "vite",
                "build",
                "--config",
                path.join(workspace, "vite.config.mjs"),
              ],
              fixture,
              {
                TREE_ENTRY: path.join(workspace, `${name}.js`),
                TREE_OUT: out,
              }
            )
            const bundle = path.join(out, "bundle.js")
            const size = statSync(bundle).size
            console.log(`tree-shaking ${name} raw=${size}`)
            console.log(readFileSync(bundle, "utf8").slice(0, 300))
          }

          rmSync(workspace, { recursive: true, force: true })
          rmSync(artifacts, { recursive: true, force: true })
          NODE
