name: Generate Next App Router Fixture Lock

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'test/next-app-router-consumer' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fixtures/next-app-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixtures/next-app-router/package.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit fixture lockfile
        shell: bash
        working-directory: .
        run: |
          if [ -z "$(git status --porcelain -- fixtures/next-app-router/package-lock.json)" ]; then
            echo "Fixture lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/next-app-router/package-lock.json
          git commit -m "build: lock Next App Router fixture dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
