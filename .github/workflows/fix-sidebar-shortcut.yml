name: Fix sidebar shortcut

on:
  push:
    branches:
      - test/sidebar-interactions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/patch-sidebar-shortcut.mjs
      - run: npx prettier --write src/components/ui/sidebar.tsx tests/runtime/sidebar-interactions.test.tsx
      - run: npm run verify
      - name: Commit shortcut hardening
        run: |
          rm .github/workflows/fix-sidebar-shortcut.yml
          rm scripts/patch-sidebar-shortcut.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/sidebar.tsx tests/runtime/sidebar-interactions.test.tsx .github/workflows/fix-sidebar-shortcut.yml scripts/patch-sidebar-shortcut.mjs
          git commit -m "fix: harden sidebar keyboard shortcut targets"
          git push
