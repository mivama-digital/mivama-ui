name: Fix sidebar shortcut

on:
  push:
    branches:
      - test/sidebar-interactions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Harden editable-target detection
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = 'src/components/ui/sidebar.tsx'
          const source = await readFile(path, 'utf8')
          const before = `        const target = event.target as HTMLElement | null
          if (
            target &&
            (target.isContentEditable ||
              target.matches("input, textarea, select"))
          ) {
            return
          }`
          const after = `        const target = event.target
          if (
            target instanceof Element &&
            (target.matches("input, textarea, select") ||
              target.closest(
                '[contenteditable]:not([contenteditable="false"])'
              ))
          ) {
            return
          }`
          if (!source.includes(before)) throw new Error('Sidebar shortcut block not found')
          await writeFile(path, source.replace(before, after))
          NODE
      - run: npx prettier --write src/components/ui/sidebar.tsx tests/runtime/sidebar-interactions.test.tsx
      - run: npm run verify
      - name: Commit shortcut hardening
        run: |
          rm .github/workflows/fix-sidebar-shortcut.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/sidebar.tsx tests/runtime/sidebar-interactions.test.tsx .github/workflows/fix-sidebar-shortcut.yml
          git commit -m "fix: harden sidebar keyboard shortcut targets"
          git push
