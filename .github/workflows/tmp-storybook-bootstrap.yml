name: Temporary Storybook bootstrap

on:
  push:
    branches: [docs/storybook]

permissions:
  contents: write

concurrency:
  group: storybook-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/storybook
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve Storybook dependencies
        run: >-
          npm install --save-dev
          storybook@10.5.5
          @storybook/react-vite@10.5.5
          @storybook/addon-docs@10.5.5
          @storybook/addon-a11y@10.5.5
      - name: Commit dependency resolution
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add Storybook dependencies"
          git push origin HEAD:docs/storybook
