name: Bootstrap component registry

on:
  push:
    branches:
      - quality/component-registry

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure registry scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const packageJson = JSON.parse(await readFile('package.json', 'utf8'))
          Object.assign(packageJson.scripts, {
            'registry:write': 'node scripts/check-component-registry.mjs --write',
            'registry:check': 'node scripts/check-component-registry.mjs'
          })
          packageJson.scripts.verify = packageJson.scripts.verify.replace(
            'npm run audit:source &&',
            'npm run audit:source && npm run registry:check &&'
          )
          packageJson.scripts['format:check'] = `${packageJson.scripts['format:check']} config/components.mjs scripts/check-component-registry.mjs docs/generated/exports.md`
          await writeFile('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE
      - name: Generate documentation and validate
        run: |
          mkdir -p docs/generated
          npm run registry:write
          npx prettier --write package.json config/components.mjs scripts/check-component-registry.mjs docs/generated/exports.md
          npm run verify
      - name: Commit registry
        run: |
          rm .github/workflows/bootstrap-component-registry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json config/components.mjs scripts/check-component-registry.mjs docs/generated/exports.md .github/workflows/bootstrap-component-registry.yml
          git commit -m "quality: enforce component registry"
          git push
