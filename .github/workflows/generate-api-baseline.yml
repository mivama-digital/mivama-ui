name: Generate API Baseline

on:
  pull_request:

permissions:
  contents: write

jobs:
  baseline:
    if: github.event.pull_request.head.ref == 'quality/public-api-baseline' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev @microsoft/api-extractor@7.58.10 --ignore-scripts
      - name: Configure API verification scripts
        run: |
          npm pkg set 'scripts.api:check=api-extractor run'
          npm pkg set 'scripts.api:report=api-extractor run --local'
          npm pkg set 'scripts.verify=npm run lint && npm run format:check && npm run audit:source && npm run registry:check && npm run typecheck && npm run build && npm run api:check && npm run bundle:check && npm run test:coverage && npm run test:contracts && npm run pack:check && npm run package:lint'
      - run: npm run build
      - run: npm run api:report
      - name: Commit API tooling and baseline
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json etc/api/mivama-ui.api.md)" ]; then
            echo "API baseline is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json etc/api/mivama-ui.api.md
          git commit -m "quality: establish public API baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
