name: Temporary sidebar E2E formatter

on:
  push:
    branches: [test/sidebar-e2e]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/sidebar-e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Link the mobile controlled sidebar target
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"

          const path = "src/components/ui/sidebar.tsx"
          const source = fs.readFileSync(path, "utf8")
          if (!source.includes("<SheetContent\n          id={sidebarId}")) {
            const next = source.replace(
              "<SheetContent\n          dir={dir}",
              "<SheetContent\n          id={sidebarId}\n          dir={dir}"
            )
            if (next === source) throw new Error("Mobile SheetContent pattern not found")
            fs.writeFileSync(path, next)
          }
          NODE
      - run: npx prettier --write src/components/ui/sidebar.tsx fixtures/vite-react-19/src/App.tsx tests/e2e/sidebar.spec.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Commit prepared E2E changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/sidebar.tsx fixtures/vite-react-19/src/App.tsx tests/e2e/sidebar.spec.ts
          git commit -m "fix: link mobile sidebar controls"
          git push origin HEAD:test/sidebar-e2e
