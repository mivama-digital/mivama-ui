name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from package.json
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify npm package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin OIDC-capable npm CLI
        run: npm install --global npm@11.18.0
      - name: Verify npm CLI
        run: test "$(npm --version)" = "11.18.0"
      - run: npm ci --ignore-scripts
      - name: Validate release intent
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.tag }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
          const expectedRepository = "https://github.com/mivama-digital/mivama-ui.git"
          const repository =
            typeof pkg.repository === "string" ? pkg.repository : pkg.repository?.url

          if (process.env.GITHUB_REF !== "refs/heads/main") {
            throw new Error(`Releases must run from main, got ${process.env.GITHUB_REF}`)
          }
          if (process.env.REPOSITORY_VISIBILITY !== "public") {
            throw new Error(
              `This release contract requires npm provenance, which Trusted Publishing only generates from a public GitHub repository. Current visibility: ${process.env.REPOSITORY_VISIBILITY}`
            )
          }
          if (process.env.REQUESTED_VERSION !== pkg.version) {
            throw new Error(
              `Requested version ${process.env.REQUESTED_VERSION} does not match package.json ${pkg.version}`
            )
          }
          if (repository !== expectedRepository) {
            throw new Error(
              `package.json repository must be ${expectedRepository}, got ${repository ?? "missing"}`
            )
          }

          const pendingChangesets = fs
            .readdirSync(".changeset")
            .filter((file) => file.endsWith(".md") && file !== "README.md")
          if (pendingChangesets.length > 0) {
            throw new Error(
              `Consume pending changesets before publishing: ${pendingChangesets.join(", ")}`
            )
          }

          if (pkg.version.includes("-") && process.env.NPM_TAG === "latest") {
            throw new Error("Pre-release versions must use the next dist-tag")
          }
          NODE
      - name: Ensure Git tag is unused
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [ -n "$existing" ]; then
            echo "Git tag ${tag} already exists; release versions must map to one immutable source revision." >&2
            exit 1
          fi
      - name: Ensure version is unpublished
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process"

          const output = execFileSync(
            "npm",
            ["view", "@mivama/ui", "versions", "--json"],
            { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] }
          )
          const parsed = JSON.parse(output)
          const versions = Array.isArray(parsed) ? parsed : [parsed]
          if (versions.includes(process.env.VERSION)) {
            throw new Error(`@mivama/ui@${process.env.VERSION} is already published`)
          }
          NODE
      - run: npm audit --omit=dev
      - name: Publish with prepublishOnly verification and npm Trusted Publishing
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: npm publish --access public --tag "$NPM_TAG"
      - name: Verify exact published registry release
        run: node scripts/check-registry-release.mjs "${{ inputs.version }}"

  github-release:
    name: Sync GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag="v${VERSION}"
          args=(
            release create "$release_tag"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$release_tag"
            --generate-notes
          )
          if [ "$NPM_TAG" = "next" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
