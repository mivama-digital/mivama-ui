name: Bootstrap package quality gates

on:
  push:
    branches:
      - quality/package-api-gates

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install package quality tools
        run: npm install --save-dev publint @arethetypeswrong/cli
      - name: Configure package scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const packageJson = JSON.parse(await readFile('package.json', 'utf8'))
          Object.assign(packageJson.scripts, {
            'package:publint': 'publint',
            'package:types': 'attw --pack . --profile node16 --exclude-entrypoints styles.css tokens.css themes.css --ignore-rules cjs-resolves-to-esm',
            'package:lint': 'npm run package:publint && npm run package:types'
          })
          packageJson.scripts.verify = `${packageJson.scripts.verify} && npm run package:lint`
          await writeFile('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE
      - name: Validate package quality
        run: |
          npx prettier --write package.json package-lock.json
          npm run verify
      - name: Commit package quality gates
        run: |
          rm .github/workflows/bootstrap-package-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/bootstrap-package-quality.yml
          git commit -m "quality: add package validation gates"
          git push
