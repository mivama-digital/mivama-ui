name: Temporary Storybook validation

on:
  push:
    branches: [docs/storybook]

permissions:
  contents: write

concurrency:
  group: storybook-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/storybook
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Convert stories to static CSF metadata
        run: node scripts/tmp-convert-storybook-csf.mjs
      - name: Normalize Storybook sources
        run: npx prettier --write .storybook stories scripts/check-storybook-coverage.mjs tsconfig.storybook.json
      - run: npm run storybook:check
      - run: npm run storybook:typecheck
      - run: npm run storybook:build
      - name: Commit validated Storybook sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/tmp-storybook-validate.yml scripts/tmp-convert-storybook-csf.mjs
          git add .storybook stories scripts/check-storybook-coverage.mjs tsconfig.storybook.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize static Storybook stories"
          gh auth setup-git
          git push origin HEAD:docs/storybook
