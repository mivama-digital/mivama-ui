name: Temporary pagination fix

on:
  push:
    branches: [test/navigation-layout-components]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/navigation-layout-components
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/components/ui/pagination.tsx
      - run: npm run build
      - run: npm run api:report
      - name: Commit generated output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/pagination.tsx etc/api/mivama-ui.api.md
          git commit -m "style: finalize pagination link fix"
          git push origin HEAD:test/navigation-layout-components
