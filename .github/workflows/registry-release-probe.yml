name: Registry Release Probe

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published @mivama/ui version to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-release-probe-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  probe:
    name: Registry release probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require protected release branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Registry release probes must run from main." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/vite-react-19/package-lock.json
            fixtures/next-app-router/package-lock.json
      - run: npm install --global npm@11.18.0
      - run: npm ci --ignore-scripts
      - name: Verify exact registry release
        run: node scripts/check-registry-release.mjs "${{ inputs.version }}"
