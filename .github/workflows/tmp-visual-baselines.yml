name: Temporary visual baselines

on:
  push:
    branches: [test/visual-regression]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/visual-regression
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/vite-react-19/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/e2e/visual.spec.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium tests/e2e/visual.spec.ts --update-snapshots
      - name: Commit visual baselines
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts tests/e2e/visual.spec.ts-snapshots
          git commit -m "test: record visual baselines"
          git push origin HEAD:test/visual-regression
