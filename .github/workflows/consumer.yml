name: Consumer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-react-18:
    name: Vite React 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/vite-react-18/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: node scripts/test-vite-react-18-consumer.mjs

  vite-react-19:
    name: Vite React 19
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/vite-react-19/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: node scripts/test-vite-react-19-consumer.mjs

  next-app-router:
    name: Next App Router
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/next-app-router/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: node scripts/test-next-app-router-consumer.mjs

  ssr-imports:
    name: SSR Imports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: node scripts/check-packed-ssr.mjs
