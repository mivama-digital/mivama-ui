name: Temporary registry probe formatting

on:
  push:
    branches: [release/registry-probe]

permissions:
  contents: write

concurrency:
  group: registry-probe-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/registry-probe
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write scripts/lib/package-source.mjs scripts/test-vite-react-19-consumer.mjs scripts/test-next-app-router-consumer.mjs scripts/check-packed-ssr.mjs scripts/check-packed-tree-shaking.mjs scripts/check-registry-release.mjs .github/workflows/registry-release-probe.yml
      - run: npm run lint:node
      - run: npm run format:check
      - name: Commit normalized sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/tmp-registry-format.yml
          git add scripts .github/workflows/registry-release-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: normalize registry release probe"
          gh auth setup-git
          git push origin HEAD:release/registry-probe
