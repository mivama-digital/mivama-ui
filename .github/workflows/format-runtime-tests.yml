name: Format runtime tests

on:
  push:
    branches:
      - test/forms-tabs-switch-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/runtime/forms-tabs-switch.test.tsx
      - run: npm run verify
      - name: Commit formatting
        run: |
          rm .github/workflows/format-runtime-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime/forms-tabs-switch.test.tsx .github/workflows/format-runtime-tests.yml
          git commit -m "test: finalize runtime coverage"
          git push
