name: Temporary release metadata

on:
  push:
    branches: [release/trusted-publishing]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/trusted-publishing
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add canonical repository metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"

          const path = "package.json"
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
          pkg.repository = {
            type: "git",
            url: "https://github.com/mivama-digital/mivama-ui.git",
          }
          pkg.bugs = {
            url: "https://github.com/mivama-digital/mivama-ui/issues",
          }
          pkg.homepage = "https://github.com/mivama-digital/mivama-ui#readme"
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
      - run: npm install --package-lock-only --ignore-scripts
      - run: npx prettier --write package.json .github/workflows/release.yml docs/maintainers/releases.md
      - run: npm run package:lint
      - name: Commit generated metadata
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json .github/workflows/release.yml docs/maintainers/releases.md)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/release.yml docs/maintainers/releases.md
          git commit -m "release: finalize trusted publishing metadata"
          git push origin HEAD:release/trusted-publishing
