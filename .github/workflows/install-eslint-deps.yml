name: Install ESLint Dependencies

on:
  pull_request:

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.ref == 'quality/typescript-eslint' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev @babel/core @babel/eslint-parser @babel/preset-typescript eslint-plugin-react-hooks eslint-plugin-jsx-a11y --ignore-scripts
      - name: Commit dependency lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add TypeScript React ESLint dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
