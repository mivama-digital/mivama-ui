name: Apply sidebar persistence migration

on:
  push:
    branches:
      - agent/sidebar-secure-persistence

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply migration
        run: node scripts/apply-sidebar-persistence.mjs
      - name: Format and verify
        run: |
          npx prettier --write src/components/ui/sidebar.tsx src/components/ui/sidebar-persistence.ts tests/runtime/sidebar-persistence.test.ts
          npm run verify
      - name: Commit migration
        run: |
          rm .github/workflows/apply-sidebar-persistence.yml scripts/apply-sidebar-persistence.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: secure sidebar persistence"
          git push
